<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dinner Plan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f2f7">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <button class="nav-arrow" data-dir="prev" aria-label="Previous week">‹</button>
                <div id="month-label"></div>
                <button class="nav-arrow" data-dir="next" aria-label="Next week">›</button>
            </div>
            <div class="date-strip" id="date-strip"></div>
        </header>

        <main id="calendar-container">
            <div id="calendar-wrapper"></div>
        </main>

        <nav class="bottom-nav">
            <button class="secondary-btn" id="popular-btn">Popular</button>
            <button class="manage-btn" id="manage-meals-btn">Edit Meals</button>
        </nav>
    </div>

    <div id="picker-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="picker-date-label">Select Meal</h3>
                <button data-close="picker-modal" class="close-modal-btn grey">Cancel</button>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="text" id="meal-search-input" placeholder="Enter meal name..."
                       style="width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 17px;">
            </div>
            <div id="meal-selection-list"></div>
        </div>
    </div>

    <div id="meal-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Meals</h3>
                <button data-close="meal-modal" class="close-modal-btn">Done</button>
            </div>
            <div id="meal-list-edit"></div>
        </div>
    </div>

    <div id="popular-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Most Popular</h3>
                <button data-close="popular-modal" class="close-modal-btn">Done</button>
            </div>
            <div class="range-selector" id="popular-range-selector">
                <button data-range="30" class="active">30 Days</button>
                <button data-range="90">90 Days</button>
                <button data-range="all">All Time</button>
            </div>
            <div id="popular-list"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
